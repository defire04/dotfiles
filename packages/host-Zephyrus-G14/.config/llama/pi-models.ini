; Модели для pi на ноуте (llama-server в режиме роутера, --models-max 1: одна модель в видеопамяти, смена в Pi через /model).
; Имя секции = id модели в ~/.pi/agent/models.json. Пути абсолютные: llama-server не раскрывает ~.
; Настройки из замеров llm-bench (ноут, 03–05.11.2026), presence-penalty 1.5 после зацикливаний на ПК (06.11.2026).

[qwen3.6-35b-a3b]
; по умолчанию: лучший прогон на ноуте, 24 слоя экспертов в оперативке под 256K, ~80–85 т/с.
; Без load-mode none (07.11.2026): с ним модель целиком в памяти программы, и когда рядом браузер и IDEA,
; система сжимала её в zram (19 ГБ), скорость падала с 68 до 35 т/с. Без него модель в кэше файлов и вытесняется без сжатия.
model = /home/dima/.local/share/llm/models/MoE/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
; mmproj: «глаз» для картинок (0,9 ГБ видеопамяти), поэтому на 2 слоя экспертов больше в оперативке
mmproj = /home/dima/.local/share/llm/models/MoE/mmproj-Qwen3.6-35B-A3B-F16.gguf
n-gpu-layers = 99
n-cpu-moe = 26
ctx-size = 262144
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
threads = 12
parallel = 1
spec-type = draft-mtp
spec-draft-n-max = 2
jinja = true
reasoning-format = deepseek
context-shift = false
cache-reuse = 256
batch-size = 2048
ubatch-size = 512
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

