# Аппаратное декодирование видео (VA-API) в Brave — ноутбук G14, встроенная AMD 890M.
# Без этих флагов видео декодирует процессор и шейдеры (видеодекодер VCN = 0 %), лишние ватты.
# Флаги из вики CachyOS: https://wiki.cachyos.org/configuration/enabling_hardware_acceleration_in_google_chrome/
# Проверка: brave://gpu -> Video Decode: Hardware accelerated; F12 -> Media -> декодер VaapiVideoDecoder.
# TouchpadOverscrollHistoryNavigation — «назад/вперёд» свайпом двумя пальцами по тачпаду (как на телефоне).
# Откат: удалить файл и перезапустить Brave. Читает /usr/bin/brave (строки с # пропускаются).
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,CanvasOopRasterization,VaapiIgnoreDriverChecks,UseMultiPlaneFormatForHardwareVideo,TouchpadOverscrollHistoryNavigation
